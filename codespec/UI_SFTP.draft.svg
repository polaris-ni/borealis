  <circle cx="10" cy="132" r="9" fill="#BD93F9"/><text x="10" y="136" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">5</text>
  <text x="30" y="136">传输：栏间对传按钮＋底部传输条（进度/取消/排队计数）；串行队列，取消即清半成品（D7①/D9①）</text>
  <circle cx="10" cy="166" r="9" fill="#BD93F9"/><text x="10" y="170" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">6</text>
  <text x="30" y="170">异常态：断线/认证失败置灰＋错误文案＋重试；面板随所属 SSH 标签开关（D8①）</text>
