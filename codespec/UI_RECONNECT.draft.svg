  <line x1="0" y1="74" x2="880" y2="74" stroke="#3A3C4C" stroke-width="1"/>
  <!-- 视口（单会话：一标签一格） -->
  <rect x="0" y="74" width="880" height="446" fill="#282A36"/>
  <rect x="1" y="75" width="878" height="444" fill="none" stroke="#BD93F9" stroke-width="2"/>
  <g font-family="'DejaVu Sans Mono',monospace" font-size="12.5">
    <text x="16" y="100" fill="#62728A">[deploy@app01 ~]$ tail -f build.log</text>
    <text x="16" y="122" fill="#F8F8F2">16:41:02 INFO   compile 412/980 units</text>
    <text x="16" y="144" fill="#F1FA8C">16:41:05 WARN   cache miss ratio 0.31</text>
    <text x="16" y="166" fill="#F8F8F2">16:41:09 INFO   link stage started</text>
    <text x="16" y="188" fill="#FF5555">16:41:12 ERROR ld: cannot find -lborealis</text>
    <text x="16" y="210" fill="#F8F8F2">16:41:13 INFO   writing core dump to /tmp/core.4711</text>
    <text x="16" y="232" fill="#62728A">16:41:14 NOTICE session suspended by operator</text>
    <text x="16" y="254" fill="#8B93A7">ssh_exchange_identification: Connection closed by remote host</text>
  </g>
