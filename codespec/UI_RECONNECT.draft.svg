  <line x1="16" y1="264" x2="864" y2="264" stroke="#44475A" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="16" y="282" font-size="11" fill="#62728A">↑ 浮层之下这一段回看内容不重建、不擦除（判据 1）：它是断线前最后一屏，正是需求那句「保留终端内容供回看」的对象</text>

  <!-- 重连中浮层卡片 -->
  <g>
    <rect x="254" y="341" width="380" height="132" fill="#12131C" opacity="0.55"/>
