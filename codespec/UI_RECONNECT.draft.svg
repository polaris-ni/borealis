    <text x="14" y="48" font-size="11.5" fill="#50FA7B">复列断线前那个目录（remote_path_ 不换）</text>
    <text x="14" y="67" font-size="11.5" fill="#F8F8F2">浏览继续，用户不需要重新进入路径</text>
    <text x="14" y="90" font-size="11.5" fill="#62728A">断线那一单传输按失败收尾：半成品清理腿已有，</text>
    <text x="14" y="109" font-size="11.5" fill="#62728A">本期不做续传（需求未提，登记 §7）</text>
    <text x="14" y="132" font-size="11.5" fill="#62728A">SFTP 会话仍随标签生灭（7.95 D8 不改）</text>
  </g>
  <g transform="translate(980,40)">
    <rect x="0" y="0" width="470" height="150" fill="#1E1F29" stroke="#4D4F63" stroke-width="1"/>
    <text x="14" y="24" font-size="12" fill="#8B93A7" font-weight="600">步骤 3 · 重拨失败</text>
    <text x="14" y="48" font-size="11.5" fill="#FF5555">state_ = ConnState::Failed（既有档位，不新增）</text>
    <rect x="14" y="62" width="96" height="26" rx="5" fill="#BD93F9"/>
    <text x="62" y="80" font-size="12" fill="#1E1F29" font-weight="600" text-anchor="middle">重试</text>
    <text x="124" y="80" font-size="11.5" fill="#62728A">＝ 既有 sftp.action.retry → connect_now() 那条腿</text>
    <text x="14" y="108" font-size="11.5" fill="#62728A">今天缺的正是这一档：操作期失败从不写 state_，</text>
    <text x="14" y="127" font-size="11.5" fill="#62728A">「重试」按钮只在初次连接失败时出现过</text>
  </g>
  <text x="0" y="216" font-size="11.5" fill="#5a6070">凭据面零外扩（与 D1 代价 (a) 不同）：装配层已按标签驻留 ssh_secret_by_tab，SftpPanel 每次经 resolve_secret 现取（7.95 D8 既定形态），故本条不新增明文驻留、不破 CONN.09。</text>
  <text x="0" y="236" font-size="11.5" fill="#5a6070">可测面：分类表进 utest_reconnect（SftpError → 是否掉线类）；面板侧那一行 state_ 迁移无头不可测（client_ 非注入点，SFTP 面板今天无 itest 覆盖），判据归真机走查。</text>
