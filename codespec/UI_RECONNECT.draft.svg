<rect x="0" y="0" width="1560" height="1430" fill="#eef0f5"/>
<text x="30" y="34" font-size="20" font-weight="700" fill="#1b1f28">SSH 断线自动重连：重连中浮层 + 终态三分 + 退避档位 + SFTP 掉线重拨（`SPEC.FEAT.WS.05` 的 SSH 腿）</text>
<text x="30" y="56" font-size="12.5" fill="#5a6070">UI_RECONNECT.draft.svg · 高保真草图（待评审） · 窗口 880×520 dp @100% DPI · 底部 1–7 标号判据对应本稿 §2 · D1–D7 已于 2026-10-09 逐条裁决，见 UI_RECONNECT.draft.md §3</text>

<!-- ============================ 屏 A：重连中 ============================ -->
<g transform="translate(30,80)">
  <rect x="-1" y="0" width="882" height="522" fill="#1E1F29" stroke="#4D4F63" stroke-width="1"/>
