<!-- ===== 底部右：判据清单 ===== -->
<g transform="translate(920,1010)" font-size="12" fill="#1b1f28">
  <g transform="translate(0,14)"><circle cx="10" cy="-4" r="10" fill="#BD93F9"/><text x="10" y="0" font-size="11" fill="#1E1F29" font-weight="700" text-anchor="middle">1</text><text x="30" y="0">入口与形态：tunnels.open 命令呼出左侧停靠卡片（非模态），不依赖任何标签——零 SSH 标签可启停（D1①）</text></g>
  <g transform="translate(0,44)"><circle cx="10" cy="-4" r="10" fill="#BD93F9"/><text x="10" y="0" font-size="11" fill="#1E1F29" font-weight="700" text-anchor="middle">2</text><text x="30" y="0">列表行两行堆叠：名称 + 形态徽标（-L/-R/-D）+ 状态 + 启停按钮；次行 监听点 → 目标 + 承载档案（D2① 推荐）</text></g>
  <g transform="translate(0,74)"><circle cx="10" cy="-4" r="10" fill="#BD93F9"/><text x="10" y="0" font-size="11" fill="#1E1F29" font-weight="700" text-anchor="middle">3</text><text x="30" y="0">状态五档色徽标 + Backoff「原因 · 第 N 次重试 · Xs 后」+ Failed 终态原因（TunnelError 映射文案）</text></g>
  <g transform="translate(0,104)"><circle cx="10" cy="-4" r="10" fill="#BD93F9"/><text x="10" y="0" font-size="11" fill="#1E1F29" font-weight="700" text-anchor="middle">4</text><text x="30" y="0">-R 的 0 端口：配置态显示「由服务器择定」，Active 后换成 bound_port 回报的实际端口</text></g>
  <g transform="translate(0,134)"><circle cx="10" cy="-4" r="10" fill="#BD93F9"/><text x="10" y="0" font-size="11" fill="#1E1F29" font-weight="700" text-anchor="middle">5</text><text x="30" y="0">编辑对话框：三式类型卡定字段集；自动启动开关＋重试三字段（D8②/D9）；校验走 specs_conflict</text></g>
  <g transform="translate(0,164)"><circle cx="10" cy="-4" r="10" fill="#BD93F9"/><text x="10" y="0" font-size="11" fill="#1E1F29" font-weight="700" text-anchor="middle">6</text><text x="30" y="0">删除两段式：运行中先「停止并删除」确认；停止即 Tunnel::stop()（join 上界为传输腿既定纪律）</text></g>
